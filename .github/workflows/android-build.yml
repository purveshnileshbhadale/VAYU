name: android-build

# Builds the VAYU Android app and publishes the APK as a run artifact.
#
# The repo ships prebuilt APKs in docs/downloads, but those are cut by hand on
# a Windows machine — there is no committed Unix gradlew, so the project could
# only ever be built there. This runs the same build on Linux and attaches the
# result to the run, so any change to android/ can be installed and tested
# without needing that machine.
#
# assembleDebug on purpose: a debug-signed APK installs on a phone with no
# keystore, and no signing secret has to exist for this workflow to be useful.

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'android/**'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Also commit the APK to docs/downloads and website/downloads'
        type: boolean
        default: false

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      # The project has no Unix gradlew, so Gradle is invoked directly at the
      # version the wrapper pins (8.7, matching AGP 8.5.2).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Report what was built
        working-directory: android
        run: |
          find . -name '*.apk' -print -exec ls -lh {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VAYU-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # Run-artifact downloads are behind a short-lived signed URL on a
      # separate host, which is awkward to reach from some environments. This
      # puts the APK where this repo already keeps them, on request only —
      # off by default so routine pushes don't commit a 3MB binary each time.
      - name: Commit the APK to downloads
        if: inputs.publish
        run: |
          set -euo pipefail
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' android/app/build.gradle.kts)
          SRC=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          NAME="VAYU-v${VERSION}-debug.apk"
          for DIR in docs/downloads website/downloads; do
            mkdir -p "$DIR"
            cp "$SRC" "$DIR/$NAME"
          done
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/downloads/"$NAME" website/downloads/"$NAME"
          if git diff --cached --quiet; then
            echo "APK unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "build: ${NAME} from ${GITHUB_SHA::7}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
